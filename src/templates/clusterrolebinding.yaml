apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "loginservice.clusterrolebinding" . }}
  labels:
    {{- include "loginservice.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name:  {{ include "loginservice.clusterrole" . }}
subjects:
  - kind: ServiceAccount
    name:  {{ include "loginservice.serviceAccountName" . }}
    namespace: {{ include "loginservice.namespace" . }}
