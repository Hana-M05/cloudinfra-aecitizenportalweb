apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "loginservice.clusterrole" . }}
  namespace: {{ include "loginservice.namespace" . }}
  labels:
    {{- include "loginservice.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - nodes/metrics
      - nodes/spec
      - nodes/stats
      - nodes/proxy
      - nodes/pods
      - nodes/healthz
    verbs:
      - get
