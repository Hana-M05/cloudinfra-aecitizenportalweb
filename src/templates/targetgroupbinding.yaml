{{- if .Values.targetGroupBinding.create -}}
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: {{ include "loginservice.fullname" . }}
  namespace: {{ include "loginservice.namespace" . }}
  labels:
    {{- include "loginservice.labels" . | nindent 4 }}
spec:
    serviceRef:
        name: {{ include "loginservice.fullname" . }}
        port: {{ .Values.service.port }}
    targetGroupARN: {{ .Values.targetGroupBinding.arn }}
    targetType: ip
{{- end}}
