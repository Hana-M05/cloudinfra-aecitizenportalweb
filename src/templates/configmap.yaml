apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "citizenportalweb.configmap" . }}
  namespace: {{ include "citizenportalweb.namespace" . }}
  labels:
    {{- include "citizenportalweb.labels" . | nindent 4 }}
data:
{{- range $key, $value := .Values.config -}}
{{ printf "%s: %s" ($key | toString) ($value | toString | quote) | nindent 2 }}
{{- end -}}