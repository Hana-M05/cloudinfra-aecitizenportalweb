apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loginservice.fullname" . }}
  namespace: {{ include "loginservice.namespace" . }}
  labels:
    {{- include "loginservice.labels" . | nindent 4 }}
spec:
  #Uncomment below if the replica count has to be 1
  #{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  #{{- end }}
  selector:
    matchLabels:
      {{- include "loginservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "loginservice.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.application.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "loginservice.serviceAccountName" . }}
      shareProcessNamespace: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.application.repository }}:{{ .Values.image.application.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.application.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.application.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "loginservice.configmap" . }}
          {{- if .Values.application.volume_secret.present }}
          volumeMounts:
            - name: {{ .Values.application.volume_secret.name }}
              mountPath: {{ .Values.application.volume_secret.mountPath }}
          {{- end }}
         ## Running the Agent as a sidecar
        - image: datadog/agent
          name: datadog-agent
          env:
            - name: DD_COLLECT_KUBERNETES_EVENTS
              value: "true"
            - name: DD_APM_ENABLED
              value: "true"
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "loginservice.configmap" . }}
                  key: Datadog_Env
            - name: MY_CLUSTER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "loginservice.configmap" . }}
                  key: Datadog_ClusterName
            - name: DD_TAGS
              value: "env:$(MY_ENV) service:ae-loginservice version:v1 node_name:$(MY_NODE_NAME) pod_name:$(MY_POD_NAME) pod_ip:$(MY_POD_IP) kube_namespace:$(MY_POD_NAMESPACE) kube_deployment:ae-loginservice kube_cluster_name:$(MY_CLUSTER)"
            - name: DD_DOGSTATSD_TAGS
              value: "env:$(MY_ENV) service:ae-loginservice version:v1 node_name:$(MY_NODE_NAME) pod_name:$(MY_POD_NAME) pod_ip:$(MY_POD_IP) kube_namespace:$(MY_POD_NAMESPACE) kube_deployment:ae-loginservice kube_cluster_name:$(MY_CLUSTER)"
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "loginservice.secrets" . }}
                  key: Datadog_ApiKey
            - name: DD_SITE
              value: "datadoghq.com"
            - name: DD_EKS_FARGATE
              value: "true"
            - name: DD_KUBELET_TLS_VERIFY
              value: "false"
            - name: DD_KUBERNETES_KUBELET_NODENAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: DD_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DD_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "loginservice.configmap" . }}
                  key: Datadog_ClusterName            
            - name: DD_CHECKS_TAG_CARDINALITY
              value: "high"
            - name: DD_DOGSTATSD_TAG_CARDINALITY
              value: "high"
            - name: DD_DOGSTATSD_PORT
              value: "8125"
            - name: DD_DOGSTATSD_NON_LOCAL_TRAFFIC
              value: "true"
            - name: DD_HEALTH_PORT
              value: "5555"
            - name: DD_DOGSTATSD_SOCKET
              value: "/var/run/datadog/dsd.socket"
            - name: DD_CLUSTER_AGENT_ENABLED
              value: "true"
            - name: DD_CLUSTER_AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "loginservice.secrets" . }}
                  key: Datadog_Cluster_Agent_Token
            - name: DATADOG_CLUSTER_AGENT
              value: "dd-datadog-cluster-agent"
            - name: DATADOG_CLUSTER_AGENT_SERVICE_HOST
              value: "dd-datadog-cluster-agent.kube-system"
            - name: DATADOG_CLUSTER_AGENT_SERVICE_PORT
              value: "5005"
            - name: DD_PROCESS_AGENT_ENABLED
              value: "true"
            - name: DD_LEADER_ELECTION
              value: "true"
            - name: DD_DOGSTATSD_ORIGIN_DETECTION
              value: "true"
            - name: DD_DISABLE_CLUSTER_NAME_TAG_KEY
              value: "true"
            - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
              value: "true"              
          resources:
            requests:
              memory: "512Mi"
              cpu: "800m"
            limits:
              memory: "512Mi"
              cpu: "800m"  
      {{- if .Values.application.volume_secret.present }}
      volumes:
        - name: {{ .Values.application.volume_secret.name }}
          secret:
            secretName: {{ include "loginservice.secrets" . }}
      {{- end }}  
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
