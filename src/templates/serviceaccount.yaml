{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "citizenportalweb.serviceAccountName" . }}
  namespace: {{ include "citizenportalweb.namespace" . }}
  labels:
    {{- include "citizenportalweb.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "citizenportalweb.serviceAccountName" . }}
rules:
  - apiGroups:
      - ""
    resources:
      - nodes/metrics
      - nodes/spec
      - nodes/stats
      - nodes/proxy
      - nodes/pods
      - nodes/healthz
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "citizenportalweb.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name:  {{ include "citizenportalweb.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name:  {{ include "citizenportalweb.serviceAccountName" . }}
    namespace: {{ include "citizenportalweb.namespace" . }}
