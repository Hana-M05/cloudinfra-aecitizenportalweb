apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "citizenportalweb.fullname" . }}
  namespace: {{ include "citizenportalweb.namespace" . }}
  labels:
    {{- include "citizenportalweb.labels" . | nindent 4 }}
spec:
  #Uncomment below if the replica count has to be 1
  #{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  #{{- end }}
  selector:
    matchLabels:
      {{- include "citizenportalweb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "citizenportalweb.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.application.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "citizenportalweb.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.application.repository }}:{{ .Values.image.application.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.application.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.application.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "citizenportalweb.configmap" . }}
          {{- if .Values.application.volume_secret.present }}
          volumeMounts:
            - name: {{ .Values.application.volume_secret.name }}
              mountPath: {{ .Values.application.volume_secret.mountPath }}
          {{- end }}
      {{- if .Values.application.volume_secret.present }}
      volumes:
        - name: {{ .Values.application.volume_secret.name }}
          secret:
            secretName: {{ include "citizenportalweb.secrets" . }}
      {{- end }}  
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
