apiVersion: v1
kind: Secret
metadata:
    name: {{ include "citizenportalweb.secrets" . }}
    namespace: {{ include "citizenportalweb.namespace" . }}
type: Opaque
data:
{{- range $key, $value := .Values.secrets -}}
{{ printf "%s: %s" ($key | toString) ($value | toString | b64enc ) | nindent 2 }}
{{- end -}}